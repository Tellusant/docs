name: Submit Sitemap to IndexNow
on:
  workflow_run:
    workflows: [pages-build-deployment]
    types: [completed]
jobs:
  submit-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Submit sitemap URLs to IndexNow
        uses: jakob-bagterp/index-now-submit-sitemap-action@v1
        with:
          host: tellusant.github.io
          api_key: ${{ secrets.INDEXNOW_KEY }}
          api_key_location: https://tellusant.github.io/docs/${{ secrets.INDEXNOW_KEY }}.txt
          sitemap_locations: https://tellusant.github.io/docs/sitemap.xml
          endpoint: www.bing.com
