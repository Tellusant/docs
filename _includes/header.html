<header class="site-header">
  <div class="wrapper site-header-wrapper">
    <p class="site-name">
      <a href="{{ '/' | relative_url }}">{{ site.site_name }}</a>
    </p>
    {% if site.description %}
      <p class="site-description">{{ site.description }}</p>
    {% endif %}
  </div>
</header>
